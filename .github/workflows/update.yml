# Rebuilds and publishes the month's data.
#
# DB-IP releases on the first of each month, but not at midnight and not
# always on the first — so this runs on the fourth, and the fetch walks back up
# to three months if the newest is not there yet. A month with no release
# therefore republishes the previous one rather than failing.
name: update

on:
  schedule:
    # 04:00 UTC on the 4th. Nothing here is time-critical; the point of the
    # date is to be comfortably after DB-IP's own publish.
    - cron: "0 4 4 * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the result, rather than only building it"
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Before anything is fetched or built: the tests need no data and they
      # are what says the format still matches the shared vectors. A build that
      # published a file the app cannot read would be worse than no build.
      - name: Test
        run: python3 -m unittest discover -s tests -v

      # The vectors are generated, and a change to the format that forgot to
      # regenerate them would leave the two repositories disagreeing with
      # nothing to say so.
      - name: The checked-in vectors match the current format
        run: |
          python3 tests/make_vectors.py
          git diff --exit-code -- tests/vectors || {
            echo "::error::tests/vectors is stale — run tests/make_vectors.py and commit"
            exit 1
          }

      # A pull request stops here. Downloading 90 MB and building 24 MB of
      # shards to throw them away is twenty minutes for no answer the tests
      # above did not already give.
      - name: Build
        if: github.event_name != 'pull_request'
        run: python3 src/build.py --out public

      - name: What was produced
        if: github.event_name != 'pull_request'
        run: |
          ls -la public
          cat public/manifest.json

      # Checked here rather than trusted, because both are silent when wrong:
      # a client that cannot read the file falls back to a coarser answer, and
      # nothing tells anyone.
      - name: The output is readable
        if: github.event_name != 'pull_request'
        run: python3 src/verify.py --out public

      # Read once and reused by both publishing steps, so the two copies can
      # never be labelled with different months.
      - name: Which month this is
        id: month
        if: github.event_name != 'pull_request'
        run: |
          month=$(python3 -c "import json;print(json.load(open('public/manifest.json'))['generated'])")
          echo "month=$month" >> "$GITHUB_OUTPUT"
          echo "built $month"

      # The image and the data it serves come out of one run, so they can
      # never be a different build. That is the reason this is here rather
      # than in a workflow of its own — a separate image build would have to
      # fetch the month's export again and might get a different one.
      #
      # Cloudflare Pages is the primary, and it builds the data itself from
      # this repository — so nothing is uploaded from here. What it needs is a
      # *reason* to rebuild: it triggers on push, the repository does not
      # change monthly, and the data comes from DB-IP at build time. Left
      # alone it would serve whatever month it was first configured on.
      #
      # So this pokes it. `CF_DEPLOY_HOOK` is the URL Cloudflare gives for the
      # project; with it unset the step says so and does nothing, because a
      # fork has no such project and should not fail for it.
      #
      # The build being byte-reproducible is what makes two builders safe:
      # Cloudflare's copy and the release below are produced separately and
      # are identical, given the same month's export.
      - name: Ask Cloudflare Pages to rebuild
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::CF_DEPLOY_HOOK is unset — skipping the Pages rebuild"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "asked Cloudflare Pages to rebuild"

      # The second copy, for a network where Cloudflare is unreachable.
      # `releases/latest/download/<file>` is a fixed URL that needs no tag
      # lookup, so a client falling back to it has nothing to discover first —
      # and it is the same three files from the same run, because two
      # endpoints serving different bytes would be worse than one.
      - name: Publish a release
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month='${{ steps.month.outputs.month }}'
          notes="IP geolocation by DB-IP (https://db-ip.com), used under CC BY 4.0
          (https://creativecommons.org/licenses/by/4.0/).

          Built from dbip-city-lite-$month. City level in both families.

          \`manifest.json\` names the two bundles, their sizes packed and
          unpacked, and a sha256 for each — read it first, since it is what
          says how much a client is about to download."
          # Created if it is new, re-uploaded if the month is being rebuilt.
          # `--clobber` rather than deleting the release, so the fixed
          # `latest/download` URLs never point at nothing.
          gh release create "$month" --title "$month" --notes "$notes" public/* \
            || gh release upload "$month" --clobber public/*
