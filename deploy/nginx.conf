# The same rules as `public/_headers`, which is what the Cloudflare endpoint
# reads. Two files saying one thing is a place for them to disagree, and there
# is no format both sides understand — so this comment is the link: **change
# one and change the other.** `tests/test_deploy.py` compares them.

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

# Every path nginx wants to write, pointed at one place.
#
# The container runs `read_only` with a single writable tmpfs, and nginx opens
# a temp directory at startup whether or not it will ever use one — this
# serves files off disk and buffers nothing, so none of these is ever
# populated. Left at their compiled-in defaults under `/var/lib/nginx`, the
# process fails to start with `mkdir() ... failed (13: Permission denied)`,
# which is what it did.

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # To stdout, so `docker logs` is the log. No access log for the shards
    # themselves: the whole design is that a request discloses only a prefix,
    # and writing down which prefix somebody asked for is the one thing this
    # arrangement exists to avoid.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    gzip on;
    gzip_types application/json application/octet-stream;
    # A shard is a fixed-width array with no entropy in the high bytes of its
    # offsets, so it compresses to about half. That is the reason the format
    # can afford fixed-width records at all.
    gzip_min_length 1024;
    gzip_comp_level 6;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/ipgeo;

        # Nothing here is written, and nothing here is a directory listing.
        autoindex off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;

        # What says which month is current, so it has to be re-read. An hour,
        # not a day: a client that has just been told about a new build should
        # not wait until tomorrow for the shards to match it.
        location = /v1/index.json {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            default_type application/json;
        }

        # A shard's path carries the month it was built from, so the file at
        # a given URL really never changes and `immutable` is true rather than
        # convenient. Without the month in the path this would tell Cloudflare
        # to serve last month's answer for another thirty days.
        # Quoted, because nginx reads an unquoted `{` in a location as the
        # start of a block — an unquoted regex with a repetition count is
        # `unknown directive "4}-[0-9]"` at startup.
        location ~ "^/v1/[0-9]{4}-[0-9]{2}/" {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        location = /country_v1.bin {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        # The query page, and nothing else. `try_files` rather than a bare
        # root: a path that is not a file is a 404 rather than a directory
        # listing or a rewrite to the page, so a client binary-searching a
        # file can still tell "no such shard" from "here is some HTML".
        # Revalidated every time, unlike everything else here. The page is the
        # *client*: a stale copy keeps reading today's shards with yesterday's
        # code, and that is not hypothetical — a 32-bit-shift bug in the shard
        # split survived in browsers after it was fixed here, because this
        # block set no `Cache-Control` at all and browsers fall back to
        # heuristic freshness off `Last-Modified`. There is no way to push a
        # fix to a page nobody re-fetches.
        #
        # `no-cache` is not "do not store" — the copy is kept and a 304 costs
        # a round trip on 9 KB. That is the right price for being able to fix
        # the reader.
        #
        # The two headers above are repeated because nginx's `add_header` does
        # not merge: a block that sets any of its own inherits none of the
        # outer level's.
        location = / {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location / {
            return 404;
        }
    }
}
